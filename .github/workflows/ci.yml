name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar client Prisma
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx prisma generate && npx tsc --noEmit

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
        env:
          JWT_SECRET: ci-only-placeholder-secret-not-for-production
